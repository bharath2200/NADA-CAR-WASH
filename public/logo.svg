<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" fill="none">
  <!-- NAR Emblem Icon -->
  <g transform="translate(4, 4)">
    <rect width="52" height="52" rx="14" fill="#18231F" stroke="#23332D" stroke-width="1.5" />
    <!-- Gradient accents -->
    <defs>
      <linearGradient id="narTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0CA693" />
        <stop offset="100%" stop-color="#087F70" />
      </linearGradient>
      <linearGradient id="narGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F2D898" />
        <stop offset="100%" stop-color="#D6B46A" />
      </linearGradient>
    </defs>
    <!-- Geometric Shield / Dynamic Waterless Droplet Emblem -->
    <path d="M14 38L22 14H28L28 38H24L24 20L18 38H14Z" fill="url(#narTealGrad)" />
    <path d="M26 14L34 38H39L39 14H35L35 32L29 14H26Z" fill="url(#narTealGrad)" />
